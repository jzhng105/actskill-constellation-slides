:root{
  --bg:#080c1f;          /* Night */
  --brand:#0c1128;       /* Glass (panels) */
  --blue2:#3a44a0;       /* Deep nebula */
  --lblue:#7c8cff;       /* Nebula */
  --accent:#ffd36e;      /* Star */
  --white:#ffffff;
  --soft:#a9b3d6;        /* Ink soft: secondary text on dark */
  --mute:#6b7499;        /* Ink faint: captions on dark */
  --good:#4fd1a1;        /* Aurora Green: positive state only */
  --panel:rgba(var(--panel-rgb),.78);
  --edge:rgba(var(--line-rgb),.22);
  --paper:#ffffff; --ink:#404040;
  --head:'Sora', Arial, Helvetica, sans-serif;
  --body:'Inter', Arial, Helvetica, sans-serif;
  --top:68px; --bar:64px;
  --bg-rgb:8,12,31; --panel-rgb:12,17,40; --accent-rgb:255,211,110; --line-rgb:160,175,255;
  color-scheme:dark;
}
__THEME_CSS__
html,body{height:100%}
body{background:var(--bg);color:var(--white);font-family:var(--body);font-size:16px;overflow:hidden}

#scrim2{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .9s ease;
  background:radial-gradient(ellipse at 50% 55%, rgba(var(--bg-rgb),.55) 0%, rgba(var(--bg-rgb),.9) 75%)}

#top{position:fixed;left:0;right:0;top:0;height:calc(var(--top) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) clamp(16px,3vw,40px) 0;
  display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:5;

#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font:600 13.5px/1.25 var(--body);color:var(--white);

.panel>*{min-width:0}

.lede{font:600 clamp(20px,2vw,28px)/1.3 var(--head);color:var(--accent);text-wrap:balance}

.src{font-size:12.5px!important;line-height:1.45!important;color:var(--mute)!important}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}

}

      ${p.why && p.why.length ? `<h3>${t('More likely to buy when…', 'Direction (from beeswarm)')}</h3><ul class="ticks">${p.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
      ${p.img ? `<div class="row"><button class="btn ghost" data-bee="1">${t('Detailed chart for analysts', 'Open SHAP beeswarm (B)')}</button></div>` : ''}`,
    notes: `${p.short}. ` + (top.length ? `Top signals: ${top.map(([f, v]) => `${fname(f)} ${pc(v)}`).join(', ')}. ` : '') +
      (p.oot ? `${f1(p.oot.pos_rate)}% of ${int(p.oot.n_eligible)} eligible customers; AUC ${f3(p.oot.auc)}${p.wd ? `, in-group ${f3(p.wd.auc)}` : ''}. ` : '') +
      (p.why && p.why.length ? 'Direction points come from the SHAP beeswarm and describe patterns, not causes.' : '')});
});

function autoTakeaways() {
  const out = [];
  if (cb && gb) out.push([t('Better recommendations than today', 'Beats the group baseline'), t(`Our top pick is right ${pc0(cb['p@1'])} of the time, ${Math.round(lift)} points ahead of each group's usual mix.`, `P@1 ${pc(cb['p@1'])} vs ${pc(gb['p@1'])} group_baseline (+${f1(lift)} pts).`)]);
  else if (cb && pp) out.push([t('Better recommendations than today', 'Beats popularity'), t(`Our top pick is right ${pc0(cb['p@1'])} of the time, ${Math.round(liftPop)} points ahead of the most popular product.`, `P@1 ${pc(cb['p@1'])} vs ${pc(pp['p@1'])} popularity.`)]);
  out.push([t('Segment sets the stage', 'Segment drives the base rate'), SEG.map(([c, n]) => { const r = [...P].sort((a, b) => A(b, c) - A(a, c))[0]; return `${n} → ${r.short} (${f1(A(r, c))}%)`; }).join('; ') + '.']);
  if (avg && pp) out.push([t('Ready for new groups', 'Portable customer term'), t(`Even without a group's history the model beats the most-popular approach (${pc0(avg['p@1'])} vs ${pc0(pp['p@1'])}).`, `catboost_avg_group ${pc(avg['p@1'])} vs popularity ${pc(pp['p@1'])}; group share ${cb.group_share != null ? pc(cb.group_share) : 'n/a'}.`)]);
  if (!EX && FOLDS.length > 1 && cb.within_group_auc_fx != null && M[FOLDS[0]].catboost.within_group_auc_fx != null)
    out.push(['Watch the customer term', `Within-group AUC ${f3(M[FOLDS[0]].catboost.within_group_auc_fx)} → ${f3(cb.within_group_auc_fx)} from ${FOLDS[0]} to ${D.fold}.`]);
  if (hasShap) out.push([t('Clear, explainable signals', 'Driver families'), D.families.map(f => `${f.short}: ${P.filter(p => p.family === f.name).map(p => p.short).join(', ')}`).join(' · ') + '.']);
  return out.slice(0, 4);
}
add({id: 'close', sec: 4, layout: 'left', morph: 0, view: () => fit(new THREE.Vector3(0, 0, 0), [0, .42, 1], 5000 * Math.max(1, P.length / 10), 1500, 'left'), labels: 'universe', picks: null,
  html: () => { const tk = (ST.close && ST.close.takeaways) || autoTakeaways(), nx = ST.close && ST.close.next;
    return `<p class="eyebrow">${t('Next steps', 'Close')}</p><h2>${t('What this means for us', 'Summary')}</h2>
    ${tk.map(([a, b], k) => `<div class="take"><span class="n">${k + 1}</span><div><h3>${esc(a)}</h3><p>${esc(b)}</p></div></div>`).join('')}
    ${nx ? `<div class="next"><p class="eyebrow">${esc(nx.eyebrow || 'Next phase')}</p><h3>${esc(nx.title)}</h3>${nx.text ? `<p>${esc(nx.text)}</p>` : ''}</div>` : ''}`; },
  notes: (ST.close && ST.close.notes) || t('Close on the takeaways and the next phase.', 'Summary and open items.')});

/* -------------------------------------------------------------- labels */
const labelHost = $('#labels');
let labels = [];
function buildLabels(kind) {
  if (!G || !kind) return [];
  if (typeof kind === 'function') kind = kind(G);
  const T = G.T;
  const fromLocal = L => ({worldFn: v => L.host.localToWorld(v.copy(L.local)), a: L.a, html: L.html, cls: L.cls});
  if (kind === 'sky' || kind === 'fam') {
    const out = G.pStars.map((s, i) => ({worldFn: v => s.getWorldPosition(v), a: () => {
      const m = G.morph || 0, x = G.skyPos[i].x * (1 - m) + G.famPos[i].x * m, c = m > .5 ? G.famCtr[P[i].family].x : 0;
      return (m > .5 ? x < c : x < -40) ? 'l' : 'r'; }, off: () => s.userData.size * .5, html: esc(P[i].short), cls: ''}));
    if (kind === 'fam') FAMS.forEach(f => out.push({worldFn: v => v.copy(G.famCtr[f]).add(new T.Vector3(0, 80, 0)), a: 'c', html: `<span style="color:${FAM[f].color}">${esc(FAM[f].short)}</span>`, cls: 'fam'}));
    return out;
  }
  if (kind === 'chan') return G.chLabels.map(fromLocal);
  if (kind === 'atlas') return G.atLabels.map(fromLocal);
  if (kind === 'universe') return G.consts.filter(Boolean).map(c => ({worldFn: v => c.outer.getWorldPosition(v).add(new T.Vector3(0, 230, 0)), a: 'c', html: esc(c.p.short), cls: 'big'}));
  if (kind.startsWith('const')) { const c = G.consts[+kind.slice(5)]; return c ? c.labels.map(fromLocal) : []; }
  return [];
}
function pickList(kind) {
  if (!G || !kind) return [];
  if (kind === 'sky') return G.pStars.map(s => s.userData.core);
  if (kind === 'chan') return G.chPicks;
  if (kind === 'atlas') return G.atPicks;
  if (kind.startsWith('const')) { const c = G.consts[+kind.slice(5)]; return c ? c.picks : []; }
  return [];
}
function setLabels(kind) {
  for (const L of labels) { L.el.classList.remove('on'); setTimeout(() => L.el.remove(), 600); }
  labels = buildLabels(kind).map(L => { const el = document.createElement('div'); el.className = 'lb ' + (L.cls || ''); el.innerHTML = L.html; labelHost.appendChild(el); return {...L, el}; });
}
let _lv = null, _lv2 = null;
function updateLabels(show) {
  if (!labels.length) return;
  const W = innerWidth, H = innerHeight; _lv = _lv || new THREE.Vector3(); _lv2 = _lv2 || new THREE.Vector3();
  for (const L of labels) {
    const wp = L.worldFn(_lv2), dist = wp.distanceTo(G.cam.position);
    const v = _lv.copy(wp).project(G.cam);
    if (v.z > 1 || v.z < -1) { L.el.style.visibility = 'hidden'; continue; }
    L.el.style.visibility = '';
    const x = (v.x + 1) / 2 * W, y = (1 - v.y) / 2 * H, a = typeof L.a === 'function' ? L.a() : L.a;
    const o = (L.off ? L.off() * H / (2 * G.TAN * dist) : 0) + 6;
    let tr;
    if (a === 'r') tr = `translate(${x + o}px,${y}px) translateY(-50%)`;
    else if (a === 'l') tr = `translate(${x - o}px,${y}px) translate(-100%,-50%)`;
    else if (a === 'c') tr = `translate(${x}px,${y - 4}px) translate(-50%,-100%)`;
    else if (a === 'below') tr = `translate(${x}px,${y + 4}px) translateX(-50%)`;
    else tr = `translate(${x}px,${y}px) translateY(-50%) rotate(-38deg)`;
    L.el.style.transform = tr;
    L.el.classList.toggle('on', show);
  }
}

/* ---------------------------------------------------------- navigation */
let cur = -1, fly = null, view = null, morphTarget = 0, morphFrom = 0, morphT0 = 0, picks = [];
const stage = $('#stage');
$('#brandtag').innerHTML = `<b>${esc(ST.title || 'ML Model')}</b><br>${esc(ST.brand_tag || '')}`;
$('#dnote').textContent = t('For analysts. Each dot is one customer. Dots right of the centre line made the product more likely; colour shows the value (red high, blue low, grey not recorded).',
                            'Each dot is one eligible test row; x = SHAP value (log-odds); colour = feature value (red high, blue low, grey missing/categorical code).');
const ticks = S.map((s, k) => { const b = document.createElement('button'); b.setAttribute('aria-label', `Go to slide ${k + 1}`); b.title = `${k + 1}`; b.addEventListener('click', () => goTo(k)); $('#ticks').appendChild(b); return b; });
function goTo(i, instant = false) {
  i = Math.max(0, Math.min(S.length - 1, i));
  if (i === cur) return;
  const s = S[i]; cur = i;
  document.body.dataset.layout = s.layout;
  for (const old of stage.querySelectorAll('.panel')) { old.classList.add('leave'); setTimeout(() => old.remove(), 550); }
  const el = document.createElement('section'); el.className = `panel ${s.layout} enter`; el.innerHTML = s.html(); el.setAttribute('aria-label', `Slide ${i + 1} of ${S.length}`);
  stage.appendChild(el); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter')));
  setTimeout(() => el.classList.remove('enter'), 60);
  setTimeout(() => { if (!el.classList.contains('leave')) el.classList.add('settled'); }, reduce ? 0 : 1300);
  if (s.after) s.after(el);
  for (const x of EXTS) if (x.panel) x.panel(el, s, {reduce, TH: D.theme.colors});  // extensions can restyle a slide's charts
  $('#sec').textContent = SECS[s.sec];
  $('#count').textContent = `${String(i + 1).padStart(2, '0')} / ${S.length}`;
  ticks.forEach((b, k) => { b.classList.toggle('cur', k === i); b.classList.toggle('done', k < i); if (k === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
  $('#ntext').textContent = s.notes || '';
  if (s.product && s.product.img) { $('#dtitle').textContent = `${s.product.short}: ${t('detailed driver chart', 'SHAP beeswarm')}`; $('#dimg').src = s.product.img; $('#dimg').alt = `SHAP beeswarm for ${s.product.short}`; }
  else closeDrawer();
  try { history.replaceState(null, '', '#s' + (i + 1)); } catch (e) {}
  if (G) {
    const to = s.view();
    const from = view ? {pos: view.pos.clone(), tgt: view.tgt.clone(), sx: view.sx, sy: view.sy} : to;
    const dist = from.pos.distanceTo(to.pos);
    fly = (instant || reduce || !view) ? null : {from, to, t0: performance.now(), dur: 1300 + Math.min(dist / 2.5, 1500), arc: Math.min(dist * .18, 900)};
    if (!fly) view = {pos: to.pos.clone(), tgt: to.tgt.clone(), sx: to.sx, sy: to.sy};
    if (s.morph !== morphTarget) { morphFrom = G.morph || 0; morphTarget = s.morph; morphT0 = performance.now(); }
    setLabels(s.labels); picks = pickList(s.picks);
  }
}
const next = () => goTo(cur + 1), prev = () => goTo(cur - 1);
$('#next').addEventListener('click', next); $('#prev').addEventListener('click', prev);
stage.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { const v = g.dataset.go; if (v[0] === '+') goTo(cur + +v.slice(1)); else if (v[0] === '=') goTo(S.findIndex(s => s.id === v.slice(1))); }
  if (e.target.closest('[data-bee]')) openDrawer();
});
function openDrawer() { if (S[cur] && S[cur].product && S[cur].product.img) $('#drawer').classList.add('open'); }
function closeDrawer() { $('#drawer').classList.remove('open'); }
$('#dclose').addEventListener('click', closeDrawer);
function toggleNotes() { const n = $('#notes'), o = !n.classList.contains('open'); n.classList.toggle('open', o); $('#ntog').setAttribute('aria-pressed', String(o)); }
$('#ntog').addEventListener('click', toggleNotes);
$('#fs').addEventListener('click', () => { try { const r = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => {}); } catch (e) {} });
addEventListener('keydown', e => {
  const k = e.key, onBtn = e.target && e.target.closest && e.target.closest('button');
  if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && !onBtn)) { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
  else if (k === 'Home') goTo(0); else if (k === 'End') goTo(S.length - 1);
  else if (k === 'b' || k === 'B') { $('#drawer').classList.contains('open') ? closeDrawer() : openDrawer(); }
  else if (k === 'n' || k === 'N') toggleNotes();
  else if (k === 'Escape') { closeDrawer(); $('#notes').classList.remove('open'); $('#ntog').setAttribute('aria-pressed', 'false'); }
});
let sw = null;
addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') sw = {x: e.clientX, y: e.clientY}; });
addEventListener('pointerup', e => { if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && !(e.target.closest && e.target.closest('.tblwrap'))) dx < 0 ? next() : prev(); });

/* -------------------------------------------------------------- render */
const mouse = {x: 0, y: 0, cx: -1, cy: -1};
addEventListener('pointermove', e => { mouse.x = e.clientX / innerWidth * 2 - 1; mouse.y = e.clientY / innerHeight * 2 - 1; mouse.cx = e.clientX; mouse.cy = e.clientY; });
const tip = $('#tip');
function resize() { if (!G) return; G.renderer.setSize(innerWidth, innerHeight, false); G.cam.aspect = innerWidth / innerHeight; G.cam.updateProjectionMatrix();
  if (cur >= 0) { const to = S[cur].view(); if (fly) fly.to = to; else view = {pos: to.pos.clone(), tgt: to.tgt.clone(), sx: to.sx, sy: to.sy}; } }
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
let last = performance.now(), ray = null, lastM = -1;
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(.05, (now - last) / 1000); last = now; const tm = now / 1000, T = G.T;
  G.starMat.uniforms.uTime.value = tm;
  let show = true;
  if (fly) {
    const k = Math.min(1, (now - fly.t0) / fly.dur), e = ease(k);
    const pos = fly.from.pos.clone().lerp(fly.to.pos, e), tgt = fly.from.tgt.clone().lerp(fly.to.tgt, e);
    pos.addScaledVector(pos.clone().sub(tgt).normalize(), Math.sin(Math.PI * e) * fly.arc);
    view = {pos, tgt, sx: fly.from.sx + (fly.to.sx - fly.from.sx) * e, sy: fly.from.sy + (fly.to.sy - fly.from.sy) * e};
    show = k > .86; if (k >= 1) fly = null;
  }
  const fwd = view.tgt.clone().sub(view.pos), dist = fwd.length(); fwd.normalize();
  const right = new T.Vector3().crossVectors(fwd, new T.Vector3(0, 1, 0)).normalize(), up = new T.Vector3().crossVectors(right, fwd);
  const amp = reduce ? 0 : dist * .016;
  G.cam.position.copy(view.pos).addScaledVector(right, Math.sin(tm * .13) * amp + mouse.x * amp * 1.3).addScaledVector(up, Math.cos(tm * .11) * amp * .5 - mouse.y * amp);
  G.cam.lookAt(view.tgt);
  G.cam.setViewOffset(innerWidth, innerHeight, view.sx, view.sy, innerWidth, innerHeight);
  // families morph: a timed tween, so it finishes on schedule whatever the frame rate
  const mk = reduce ? 1 : Math.min(1, (now - morphT0) / 1600);
  G.morph = morphFrom + (morphTarget - morphFrom) * ease(mk);
  const m = Math.max(0, Math.min(1, G.morph));
  if (Math.abs(m - lastM) > 1e-4) {
    const cpos = G.pStars.map((s, i) => { s.position.lerpVectors(G.skyPos[i], G.famPos[i], m); G.starColor(s, G.pale.clone().lerp(G.famCol[i], m)); return s.position; });
    G.skyLines.material.opacity = .4 * (1 - m); G.famLines.material.opacity = .5 * m;
    setLinesFn(G.skyLines, cpos, G.skyEdges); if (G.famEdges.length) setLinesFn(G.famLines, cpos, G.famEdges); lastM = m;
  }
  if (!reduce) for (const c of G.consts) if (c) c.inner.rotation.y = Math.sin(tm * .22 + c.i) * .24;
  for (const x of EXTS) if (x.frame) x.frame(G, dt, tm, {reduce});
  G.renderer.render(G.scene, G.cam);
  updateLabels(show);
  if (picks.length && mouse.cx >= 0 && !fly) {
    ray = ray || new T.Raycaster();
    ray.setFromCamera({x: mouse.cx / innerWidth * 2 - 1, y: -(mouse.cy / innerHeight) * 2 + 1}, G.cam);
    const hit = ray.intersectObjects(picks, false)[0];
    const over = document.elementFromPoint(mouse.cx, mouse.cy);
    if (hit && hit.object.userData.tip && !(over && over.closest('.panel,#bar,#top,#drawer,#notes'))) {
      tip.innerHTML = hit.object.userData.tip; tip.hidden = false;
      const w = tip.offsetWidth; tip.style.transform = `translate(${Math.min(mouse.cx + 14, innerWidth - w - 8)}px,${mouse.cy + 16}px)`;
      document.body.style.cursor = 'pointer';
    } else { tip.hidden = true; document.body.style.cursor = ''; }
  } else tip.hidden = true;
}

try { if (!window.THREE) throw new Error('three.js did not load'); G = init3D(); for (const x of EXTS) if (x.init) x.init(G, {T: THREE, TH, reduce}); }
catch (e) { G = null; document.body.classList.add('no-gl'); console.warn('3D disabled:', e && e.message); }
const h = /^#s(\d+)$/.exec(location.hash || ''); const start = h ? Math.max(0, Math.min(S.length - 1, +h[1] - 1)) : 0;
if (G) { resize(); addEventListener('resize', resize); }
goTo(start, true);
if (G) requestAnimationFrame(tick);
})();
</script>
